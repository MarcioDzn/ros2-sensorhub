name: ROS2 CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base 

    steps:
      # ESSENCIAL: Instalar git/tar/curl antes de qualquer coisa para o checkout funcionar
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y git tar curl ccache
        shell: bash

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ccache storage
        uses: actions/cache@v4 # Atualizei para v4 (mais rápido)
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: rosdep cache
        uses: actions/cache@v4
        with:
          path: ~/.ros/rosdep
          key: ${{ runner.os }}-rosdep-${{ hashFiles('**/package.xml') }}

      - name: Install dependencies
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y
        shell: bash

      - name: Build
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR=$HOME/.ccache
          
          # Carrega o ambiente do ROS
          . /opt/ros/humble/setup.bash
          
          colcon build \
            --symlink-install \
            --packages-up-to pressure_node \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Test
        run: |
          # Você precisa do source do ROS E do seu workspace para testar
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          
          colcon test \
            --packages-select pressure_node \
            --event-handlers console_direct+
            
          colcon test-result --verbose
        shell: bash