version: "3.9"

services:
  sensorhub:
    privileged: true
    build:
      context: ..
      dockerfile: dev/Dockerfile
    network_mode: host
    ipc: host
    volumes: 
      - ..:/app/ros2_ws
      - /tmp:/tmp
    env_file: ./.env.pc
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    
    # apenas na raspberry
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/gpiomem:/dev/gpiomem
    tty: true
    stdin_open: true
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        if [ ! -d /tmp/WiringPi ]; then
          cd /tmp &&
          git clone https://github.com/WiringPi/WiringPi.git;
        fi &&
        cd /tmp/WiringPi &&
        ./build &&
        cd /app/ros2_ws &&
        bash"
